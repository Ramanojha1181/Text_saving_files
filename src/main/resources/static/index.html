<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Application</title>
    <style>

    </style>
</head>
<body>
    <h1>Welcome to the Demo Application</h1>
    <div class="content">
        <input type="text" id="text" placeholder="Enter some text">
        <button id="save">Save It</button>
    </div>
    <script>
        const text = document.querySelector('#text');
        const save = document.querySelector('#save');
        // const $ = id => document.getElementById(id);
        // $('save').onclick = () => {
        //     console.log(text.value);
        // };
        save.onclick = function() {
            // console.log(text.value);
            const blob = new Blob([text.value],{type: 'text/plain'});   
            upload('/api/text', blob, 'text.txt');
        };
        async function upload(url, blob, filename){
            const form = new FormData();
            form.append('file', blob, filename);
            const res = await fetch(url, {method: 'POST',   body: form });
            const data = await res.text();
            if(res.ok){
                alert(data);
            }else{
                alert('Upload failed: ' + data);
            }
        }
        
    </script>
</body>
</html>
